[SERVICE]
   Flush                     1
   Log_Level                 info
   Daemon                    off
   Parsers_File              parsers.conf
   HTTP_Server               On
   HTTP_Listen               0.0.0.0
   HTTP_Port                 2020
   storage.path              buffer
   storage.sync              normal
   storage.checksum          off
   storage.max_chunks_up     128
   storage.backlog.mem_limit 5M
   storage.total_limit_size  100M

[INPUT]
   Name              tail
   Path              ${BI_LOG_DIR}/*/app.log
   Parser            bal_logfmt_parser
   Tag               ballerina.*
   DB                db/tail-ballerina.db
   DB.locking        true
   DB.journal_mode   WAL
   Refresh_Interval  5
   Ignore_Older      2h
   Mem_Buf_Limit     256MB
   Skip_Long_Lines   On
   Read_from_Head    On
   Path_Key          log_file_path

[FILTER]
   Name    lua
   Match   ballerina.*
   Script  scripts.lua
   Call    process_bal_logs

[FILTER]
   Name rewrite_tag
   Match ballerina.*
   Rule $logger ^metrics$ ballerina_metrics false
   Emitter_Name re_emitted_bal_metrics

[FILTER]
   Name rewrite_tag
   Match ballerina.*
   Rule $module .* ballerina_app_logs false
   Emitter_Name re_emitted_bal_app_logs

[FILTER]
   Name    lua
   Match   ballerina_metrics
   Script  scripts.lua
   Call    extract_bal_metrics_data

[FILTER]
   Name    lua
   Match   ballerina_app_logs
   Script  scripts.lua
   Call    generate_document_id
   time_as_table true

[FILTER]
   Name    lua
   Match   ballerina_metrics
   Script  scripts.lua
   Call    generate_document_id
   time_as_table true

[OUTPUT]
   Name opensearch
   Host localhost
   Port 9200
   Logstash_Format On
   Logstash_DateFormat %Y-%m-%d
   Logstash_Prefix ballerina-application-logs
   Match ballerina_app_logs
   Buffer_Size 2M
   Replace_Dots On
   Suppress_Type_Name On
   Id_Key doc_id
   Trace_Error On

[OUTPUT]
   Name opensearch
   Host localhost
   Port 9200
   Logstash_Format On
   Logstash_DateFormat %Y-%m-%d
   Logstash_Prefix ballerina-metrics-logs
   Match ballerina_metrics
   Replace_Dots On
   Suppress_Type_Name On
   Id_Key doc_id
   Trace_Error On
