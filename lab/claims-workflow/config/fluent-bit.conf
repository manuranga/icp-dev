[SERVICE]
   Flush                     1
   Log_Level                 info
   Daemon                    off
   Parsers_File              parsers.conf
   HTTP_Server               On
   HTTP_Listen               0.0.0.0
   HTTP_Port                 2020
   storage.path              buffer
   storage.sync              normal
   storage.checksum          off
   storage.max_chunks_up     128
   storage.backlog.mem_limit 5M
   storage.total_limit_size  100M

# ── App logs ──
[INPUT]
   Name              tail
   Path              ${BI_LOG_DIR}/app.log
   Parser            bal_logfmt_parser
   Tag               ballerina_app_logs
   DB                db/tail-app.db
   DB.locking        true
   DB.journal_mode   WAL
   Refresh_Interval  5
   Ignore_Older      2h
   Mem_Buf_Limit     256MB
   Skip_Long_Lines   On
   Read_from_Head    On
   Path_Key          log_file_path

# ── Metrics logs (separate file) ──
[INPUT]
   Name              tail
   Path              ${BI_LOG_DIR}/metrics.log
   Parser            bal_logfmt_parser
   Tag               ballerina_metrics
   DB                db/tail-metrics.db
   DB.locking        true
   DB.journal_mode   WAL
   Refresh_Interval  5
   Ignore_Older      2h
   Mem_Buf_Limit     256MB
   Skip_Long_Lines   On
   Read_from_Head    On
   Path_Key          log_file_path

# ── The workflow worker's samples ──
# The module splits its own telemetry across two sinks: task decisions go through ballerina/log
# (so they land in app.log below), while the worker's run and activity samples are printed by the
# Java layer to stdout, which the lab captures as logs/bi.log. Tail that too, keeping only the
# sample lines — the rest of stdout is JVM noise that no index wants.
[INPUT]
   Name              tail
   Path              ${BI_STDOUT_LOG}
   Parser            bal_logfmt_parser
   Tag               ballerina_worker_stdout
   DB                db/tail-stdout.db
   DB.locking        true
   DB.journal_mode   WAL
   Refresh_Interval  5
   Ignore_Older      2h
   Mem_Buf_Limit     256MB
   Skip_Long_Lines   On
   Read_from_Head    On
   Path_Key          log_file_path

[FILTER]
   Name    grep
   Match   ballerina_worker_stdout
   Regex   logger ^workflow-metrics$

# The Java layer's samples carry no runtime id, and the console's metrics query filters on one,
# so up.sh writes the current id here after the runtime registers.
@INCLUDE runtime-id.conf

[FILTER]
   Name    rewrite_tag
   Match   ballerina_worker_stdout
   Rule    $logger ^workflow-metrics$ ballerina_workflow_metrics false
   Emitter_Name worker_metrics_emitter

# ── Split the workflow module's event samples ──
# The module logs one record per run started/closed, activity attempt, data event and task
# decision through ballerina/log (logger="workflow-metrics"), so they arrive in app.log and
# must be re-tagged out before the application-log output claims them.
[FILTER]
   Name          rewrite_tag
   Match         ballerina_app_logs
   Rule          $logger ^workflow-metrics$ ballerina_workflow_metrics false
   Emitter_Name  workflow_metrics_emitter

[FILTER]
   Name    lua
   Match   ballerina_workflow_metrics
   Script  scripts.lua
   Call    process_bal_logs

[FILTER]
   Name    lua
   Match   ballerina_workflow_metrics
   Script  scripts.lua
   Call    generate_document_id
   time_as_table true

# ── Enrich app logs ──
[FILTER]
   Name    lua
   Match   ballerina_app_logs
   Script  scripts.lua
   Call    process_bal_logs

# ── Enrich + extract metrics ──
[FILTER]
   Name    lua
   Match   ballerina_metrics
   Script  scripts.lua
   Call    process_bal_logs

[FILTER]
   Name    lua
   Match   ballerina_metrics
   Script  scripts.lua
   Call    extract_bal_metrics_data

# ── Document IDs ──
[FILTER]
   Name    lua
   Match   ballerina_app_logs
   Script  scripts.lua
   Call    generate_document_id
   time_as_table true

[FILTER]
   Name    lua
   Match   ballerina_metrics
   Script  scripts.lua
   Call    generate_document_id
   time_as_table true

# ── Outputs ──
[OUTPUT]
   Name opensearch
   Host localhost
   Port 9200
   Logstash_Format On
   Logstash_DateFormat %Y-%m-%d
   Logstash_Prefix ballerina-application-logs
   Match ballerina_app_logs
   Buffer_Size 2M
   Replace_Dots On
   Suppress_Type_Name On
   Id_Key doc_id
   Trace_Error On

[OUTPUT]
   Name opensearch
   Host localhost
   Port 9200
   Logstash_Format On
   Logstash_DateFormat %Y-%m-%d
   Logstash_Prefix ballerina-metrics-logs
   Match ballerina_metrics
   Replace_Dots On
   Suppress_Type_Name On
   Id_Key doc_id
   Trace_Error On

[OUTPUT]
   Name opensearch
   Host localhost
   Port 9200
   Logstash_Format On
   Logstash_DateFormat %Y-%m-%d
   Logstash_Prefix ballerina-workflow-metrics
   Match ballerina_workflow_metrics
   Replace_Dots On
   Suppress_Type_Name On
   Id_Key doc_id
   Trace_Error On
